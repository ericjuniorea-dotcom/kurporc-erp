version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: kurporc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     kurporc
      POSTGRES_PASSWORD: kurporc2026
      POSTGRES_DB:       kurporc_db
    ports:
      - "5432:5432"
    volumes:
      - kurporc_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kurporc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kurporc_redis:/data

volumes:
  kurporc_pgdata:
  kurporc_redis:
