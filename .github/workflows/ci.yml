# Integración continua (Fase 2.7 y 2.14): en cada push y pull request.
# Valida el esquema, tipos, lint y build, y corre las pruebas de aislamiento y
# seguridad contra un Postgres efímero que imita a Supabase. No usa datos reales.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: solo-para-ci
      CAMPOS_CIFRADOS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CAMPOS_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint

      - name: Preparar Postgres como Supabase (roles y esquema auth)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql
      - name: Migraciones desde cero
        run: npx prisma migrate deploy
      - name: Datos de prueba
        run: npm run db:seed && npm run db:migrar-orgs && npm run db:legales
      - name: Prueba de aislamiento entre organizaciones (Fase 1)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase1_aislamiento.sql
      - name: Prueba de auditoría y límites (Fase 2)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase2_seguridad.sql
      - name: Prueba del perfil automático al registrarse (Fase 3)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase3_auth.sql
      - name: Prueba de contratos (Fase 4)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase4_contratos.sql
      - name: Alta de organizaciones (Fase 6)
        run: npm run prueba:alta
      - name: Permisos efectivos (Fase 7)
        run: npm run prueba:permisos
      - name: Aislamiento por organización con dbOrg (Fase 7)
        run: npm run prueba:dborg
      - name: Reglas del libro de movimientos (Fase 8)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase8_finanzas.sql
      - name: Cálculos de Finanzas (Fase 8)
        run: npm run prueba:finanzas
      - name: Ventas: ingreso en el libro y baja de animales (Fase 8)
        run: npm run prueba:ventas
      - name: Engorde: indicadores, costo y margen (Fase 9)
        run: npm run prueba:engorde
      - name: Prueba de cerdas paradas (Fase 10)
        run: npm run prueba:cerdas-paradas
      - name: Mercado: precio por unidad, búsqueda sin acentos y reglas de publicación (Fase 12)
        run: npm run prueba:mercado
        env:
          NODE_OPTIONS: --conditions=react-server
      - name: Pedidos: aprobación, comparativa, eventos y recepción en Stock y Finanzas (Fase 13)
        run: npm run prueba:pedidos
        env:
          NODE_OPTIONS: --conditions=react-server
      - name: Motor de necesidades: sugerencia, frascos por día y ración por calendario (Fase 14)
        run: npm run prueba:necesidades
        env:
          NODE_OPTIONS: --conditions=react-server
      - name: Línea de tiempo de los ciclos de la cerda
        run: npm run prueba:ciclos
      - name: Cerdas dadas de baja fuera de Maternidad y de la agenda
        run: npm run prueba:bajas
        env:
          NODE_OPTIONS: --conditions=react-server
      - name: Control de super administradores (Fase 11)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/fase11_admin.sql
      - name: Las migraciones coinciden con el esquema
        run: |
          out=$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script)
          echo "$out" | grep -q "This is an empty migration" || { echo "$out"; exit 1; }

      - run: npm run build

      - name: Dependencias con vulnerabilidades críticas
        # Se pasa a --audit-level=high cuando se actualice Next.js (ver docs/FASE_2.md)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
